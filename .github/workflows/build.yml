name: Build NokorClient

on:
  push:
    branches: [ main, master, v3_openjdk ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Create output directory
        run: mkdir -p out

      # Build debug APK (always)
      - name: Build Debug APK
        run: |
          ./gradlew :app_mojo:assembleFullDebug || gradle :app_mojo:assembleFullDebug
          find app_mojo/build/outputs/apk -name "*.apk" -exec cp {} out/ \; || true
          ls -lh out/ || true

      # Build release APK if possible (unsigned if no keystore)
      - name: Build Release APK (unsigned fallback)
        continue-on-error: true
        run: |
          ./gradlew :app_mojo:assembleFullRelease || gradle :app_mojo:assembleFullRelease || true
          find app_mojo/build/outputs/apk -name "*release*.apk" -exec cp {} out/ \; || true

      - name: List built artifacts
        run: |
          echo "=== Built files ==="
          find out -type f -ls || true
          find app_mojo/build/outputs -name "*.apk" -o -name "*.aab" | head -20 || true

      # Create full source zip and split into 3 parts (20MB + 20MB + 10MB)
      - name: Create source zip and split into 3 parts
        run: |
          # Exclude build intermediates and .git to keep size reasonable
          zip -9 -qr out/NokorClient-source.zip . \
            -x "*.git*" \
            -x "*build/*" \
            -x "*.gradle/*" \
            -x "*local.properties" \
            -x "*out/*" \
            -x "*.idea/*" \
            -x "*captures/*" \
            -x "*app_mojo/build/*" || true

          # If the zip is still too big, include more exclusions or just zip the important parts
          if [ ! -f out/NokorClient-source.zip ]; then
            zip -9 -qr out/NokorClient-source.zip app_mojo README.md LICENSE .github
          fi

          ls -lh out/NokorClient-source.zip

          # Split into exactly 3 parts: 20MB, 20MB, remaining (~10MB)
          split -b 20M out/NokorClient-source.zip out/NokorClient-Android.part.
          # Rename for clarity
          mv out/NokorClient-Android.part.aa out/NokorClient-Android.part1.zip
          mv out/NokorClient-Android.part.ab out/NokorClient-Android.part2.zip
          mv out/NokorClient-Android.part.ac out/NokorClient-Android.part3.zip 2>/dev/null || true

          # If only 2 parts were created (smaller project), create empty third or adjust
          ls -lh out/NokorClient-Android.part*.zip || ls -lh out/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nokorclient-apk
          path: |
            out/*.apk
          if-no-files-found: ignore

      - name: Upload Split Zip Part 1 (20MB)
        uses: actions/upload-artifact@v4
        with:
          name: NokorClient-Android.part1
          path: out/NokorClient-Android.part1.zip
          if-no-files-found: ignore

      - name: Upload Split Zip Part 2 (20MB)
        uses: actions/upload-artifact@v4
        with:
          name: NokorClient-Android.part2
          path: out/NokorClient-Android.part2.zip
          if-no-files-found: ignore

      - name: Upload Split Zip Part 3 (remaining)
        uses: actions/upload-artifact@v4
        with:
          name: NokorClient-Android.part3
          path: out/NokorClient-Android.part3.zip
          if-no-files-found: ignore

      - name: Upload full source zip (if under limit)
        uses: actions/upload-artifact@v4
        with:
          name: NokorClient-source-full
          path: out/NokorClient-source.zip
          if-no-files-found: ignore
          retention-days: 5
