name: Run HTML View Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # អនុញ្ញាតឱ្យ Run ដោយផ្ទាល់ពីប៊ូតុងនៅលើ GitHub Actions Tab

jobs:
  test-view:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Test View Script
        run: npm test
