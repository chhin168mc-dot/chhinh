<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIF និង OGG សំឡេង</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a1e2c 0%, #2a2f45 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem 2.8rem 3rem 2.8rem;
            box-shadow: 0 30px 45px -15px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-width: 720px;
            width: 90%;
            transition: all 0.2s ease;
            text-align: center;
        }
        h1 {
            font-weight: 400;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: #cdd9f4;
            margin-top: 0;
            margin-bottom: 1.8rem;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
            padding-bottom: 0.75rem;
        }
        .gif-container {
            background: #0d0f17;
            border-radius: 32px;
            padding: 18px;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.6), 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 2.5rem;
            border: 1px solid #3d435e;
        }
        .gif-container img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: contain;
            border-radius: 20px;
            background: #0a0c12;
            image-rendering: auto;
        }
        .audio-area {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 60px;
            padding: 1.2rem 1.8rem;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1.2rem 1.8rem;
        }
        audio {
            width: 100%;
            max-width: 280px;
            height: 44px;
            border-radius: 40px;
            background: #1e2337;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }
        audio::-webkit-media-controls-panel {
            background: #262d47;
            border-radius: 40px;
        }
        audio::-webkit-media-controls-play-button {
            background-color: #5d6e9e;
            border-radius: 50%;
        }
        .badge {
            color: #aeb9da;
            background: #262d47;
            padding: 0.45rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.4px;
            border: 1px solid #414b6b;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.03);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .badge span {
            opacity: 0.7;
            font-size: 1rem;
        }
        .footer-note {
            margin-top: 1.8rem;
            color: #6c759b;
            font-size: 0.8rem;
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(255,255,255,0.03);
            padding-top: 1.2rem;
        }
        @media (max-width: 500px) {
            .card { padding: 1.8rem 1.2rem; }
            .audio-area { flex-direction: column; gap: 1rem; }
            audio { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎞️ GIF · សំឡេង OGG</h1>

        <!-- ផ្នែកបង្ហាញ GIF -->
        <div class="gif-container">
            <img 
                src="ff.gif" 
                alt="រូបភាព GIF ស្អាត"
                loading="lazy"
            >
        </div>

        <!-- ផ្នែកសំឡេង OGG -->
        <div class="audio-area">
            <audio controls preload="metadata">
                <!-- បញ្ជាក់ឯកសារ OGG (ផ្លាស់ប្តូរ src តាមត្រូវការ) -->
                <source src="ff.ogg" type="audio/ogg">
                <!-- fallback ប្រសិនបើ browser មិន support OGG -->
                Your browser does not support the audio element.
            </audio>
            <div class="badge">
                <span>🎵</span> .ogg
            </div>
        </div>
        <div class="footer-note">
            ⚡ GIF ពី Giphy · សំឡេង OGG ឧទាហរណ៍
        </div>
    </div>
</body>
</html>
