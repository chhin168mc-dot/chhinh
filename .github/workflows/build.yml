name: Build NokorClient

on:
  push:
    branches: [ main, master, v3_openjdk ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Clone submodules manually
        run: |
          clone() {
            rm -rf "$2"
            git clone --depth 1 "$1" "$2"
          }
          clone https://github.com/MojoLauncher/glfw glfw
          clone https://github.com/MojoLauncher/mojoexec mojoexec
          clone https://github.com/MojoLauncher/MojoSDL sdl
          clone https://github.com/MojoLauncher/NoBlocklist NoBlocklist
          for d in glfw mojoexec sdl NoBlocklist; do
            test -n "$(ls -A $d)" || { echo "::error::$d is empty"; exit 1; }
          done

      # Renderer libraries (same as the upstream workflow)
      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_mojo/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: CopperLauncher/Mesa-AAR-Builder
          workflow: build-aar.yml
          workflow_conclusion: success
          name: mesa.aar
          path: app_mojo/libs

      - name: Create output directory
        run: mkdir -p out

      - name: Build Debug APK
        run: |
          ./gradlew :app_mojo:assembleFullDebug
          find app_mojo/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out/

      - name: Build Release APK (unsigned fallback)
        continue-on-error: true
        run: |
          ./gradlew :app_mojo:assembleFullRelease
          find app_mojo/build/outputs/apk -name "*release*.apk" -exec cp {} out/ \;

      - name: List built artifacts
        run: |
          find out -type f -ls || true

      # Source zip split into 3 raw parts. Rejoin with:
      #   cat NokorClient-Android.part1.zip NokorClient-Android.part2.zip NokorClient-Android.part3.zip > full.zip
      - name: Create source zip and split
        run: |
          zip -9 -qr out/NokorClient-source.zip . \
            -x ".git/*" "*/.git/*" \
            -x "*/build/*" "build/*" \
            -x ".gradle/*" "*/.gradle/*" \
            -x "*/.cxx/*" \
            -x "local.properties" \
            -x "out/*" \
            -x ".idea/*" \
            -x "captures/*"

          ls -lh out/NokorClient-source.zip

          split -b 20M -d -a 1 out/NokorClient-source.zip out/NokorClient-Android.part
          i=1
          for f in out/NokorClient-Android.part[0-9]; do
            mv "$f" "out/NokorClient-Android.part${i}.zip"
            i=$((i+1))
          done
          ls -lh out/NokorClient-Android.part*.zip

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nokorclient-apk
          path: out/*.apk
          if-no-files-found: ignore

      - name: Upload split zip parts
        uses: actions/upload-artifact@v4
        with:
          name: NokorClient-Android-parts
          path: out/NokorClient-Android.part*.zip
          if-no-files-found: ignore

      - name: Upload full source zip
        uses: actions/upload-artifact@v4
        with:
          name: NokorClient-source-full
          path: out/NokorClient-source.zip
          if-no-files-found: ignore
          retention-days: 5
